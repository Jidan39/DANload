[package]
name = "danload"
version = "0.1.0"
edition = "2024"
description = "DANload - pengunduh video dan audio untuk Windows"
build = "build.rs"

[dependencies]
# GUI. Fitur default dimatikan supaya ringan (lihat CLAUDE.md Bagian 2.6):
# - backend-winit          : jendela native Windows
# - renderer-software      : menggambar dengan CPU, tanpa memuat stack GPU
# - software-renderer-path : supaya elemen Path (ikon garis) bisa digambar
# - raw-window-handle-06   : supaya dialog pilih folder menempel ke jendela DANload
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-path",
    "raw-window-handle-06",
] }
# Membaca/menulis config.json.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dialog bawaan Windows (pilih folder, kotak pesan error).
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
# Wizard setup: mengunduh yt-dlp/FFmpeg (HTTPS, memakai sertifikat Windows),
# memeriksa checksum SHA-256, dan mengekstrak program dari arsip zip.
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
sha2 = "0.11"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Khusus Windows: fungsi Windows yang dipanggil langsung di src/system.rs (Recycle Bin, buka file
# dengan aplikasi bawaan, jam lokal). Crate resmi Microsoft yang hanya berisi deklarasi API
# Windows; versinya sama dengan yang sudah dipakai rfd, arboard, dan zip, jadi tidak ada crate
# baru yang ikut diunduh.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Mengompilasi file .slint menjadi kode Rust saat build.
slint-build = "1.18"
# Menempelkan ikon ke file .exe (hanya dipakai saat build, tidak menambah RAM).
winresource = "0.1"

# Mode debug (cargo run): dependensi tetap dioptimalkan supaya UI tidak lambat,
# karena software renderer tanpa optimasi terasa berat.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Mode rilis (cargo build --release): file .exe kecil dan cepat.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
